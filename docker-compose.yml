services:
  comercial:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: always
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: "ddccomercialtools.gestcloud.com.br,127.0.0.1,localhost"
      CSRF_TRUSTED_ORIGINS: "https://ddccomercialtools.gestcloud.com.br"
    ports:
      - "8011:8011"
    networks:
      - pi_default
    volumes:
      - comercial_data:/var/lib/postgresql/data
      - comercial_app:/app/media
volumes:
  comercial_data:
  comercial_app:
networks:
  pi_default:
    external: true
