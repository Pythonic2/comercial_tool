{% extends "base.html" %}
{% block content %}
<section class="page-header">
    <div><p class="eyebrow">Campos do contrato</p><h1>{{ contrato.titulo }}</h1></div>
    <a class="btn btn-outline-secondary" href="{% url 'contrato_detail' contrato.pk %}"><i class="bi bi-arrow-left"></i> Voltar</a>
</section>
<form method="post" class="surface stack">
    {% csrf_token %}
    {% if contrato.placeholders %}
        <div class="form-grid">{{ form.as_p }}</div>
        <button class="btn btn-brand" type="submit"><i class="bi bi-file-earmark-check"></i> Gerar documento</button>
    {% else %}
        <p>Nenhum campo no formato <code>{% verbatim %}{{nome}}{% endverbatim %}</code> foi encontrado no arquivo.</p>
    {% endif %}
</form>
{% endblock %}
