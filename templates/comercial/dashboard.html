{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Dashboard</p>
        <h1>Vendas e contratos</h1>
    </div>
</section>
<form class="filters" hx-get="{% url 'dashboard' %}" hx-target="#dashboard-content" hx-push-url="true">
    <select class="form-select" name="periodo">
        <option value="mes" {% if periodo == "mes" %}selected{% endif %}>Mês atual</option>
        <option value="semestre" {% if periodo == "semestre" %}selected{% endif %}>Semestre atual</option>
        <option value="ano" {% if periodo == "ano" %}selected{% endif %}>Ano atual</option>
        <option value="todos" {% if periodo == "todos" %}selected{% endif %}>Todos</option>
    </select>
    <select class="form-select" name="status">
        <option value="">Todos os contratos</option>
        <option value="rascunho" {% if status == "rascunho" %}selected{% endif %}>Rascunhos</option>
        <option value="aguardando_assinatura" {% if status == "aguardando_assinatura" %}selected{% endif %}>Aguardando assinatura</option>
        <option value="assinado" {% if status == "assinado" %}selected{% endif %}>Assinados / aguardando data</option>
        <option value="executado" {% if status == "executado" %}selected{% endif %}>Executados</option>
        <option value="cancelado" {% if status == "cancelado" %}selected{% endif %}>Cancelados</option>
    </select>
    <button class="btn btn-brand" type="submit"><i class="bi bi-funnel"></i> Filtrar</button>
</form>
<div id="dashboard-content">
    {% include "comercial/partials/dashboard_content.html" %}
</div>
{% endblock %}
