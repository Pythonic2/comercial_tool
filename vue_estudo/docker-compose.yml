services:
  comercial:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: always
    env_file:
      - .env
    ports:
      - "8011:8011"
    networks:
      - pi_default
    volumes:
      - comercial_data:/app/data
      - comercial_app:/app/media

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: always
    command: >
      sh -c "mkdir -p /app/data &&
      if [ ! -f /app/data/db.sqlite3 ] && [ -f /app/db.sqlite3 ]; then cp /app/db.sqlite3 /app/data/db.sqlite3; fi &&
      streamlit run main.py --server.address 0.0.0.0 --server.port 8012 --server.headless true"
    env_file:
      - .env
    ports:
      - "8012:8012"
    networks:
      - pi_default
    volumes:
      - comercial_data:/app/data
      - comercial_app:/app/media
volumes:
  comercial_data:
  comercial_app:
networks:
  pi_default:
    external: true
